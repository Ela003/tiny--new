<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ela Tasks</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Ela Tasks</h1>

            <p class="subtitle">
                My first feature running on 
            </p>

            <!-- Add Task -->
            <div class="input-area">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="Enter task"
                >

                <button
                    class="add-btn"
                    onclick="addTask()">
                    Add Task
                </button>

            </div>

            <h2>My Tasks</h2>

            <!-- Tasks will appear here -->
            <ul id="taskList"></ul>

            <p id="status" class="status">
                Loading tasks...
            </p>

        </div>

    </div>

    <script src="script.js?v=2"></script>

</body>
</html>
